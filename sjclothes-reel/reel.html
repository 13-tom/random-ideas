<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SJClothes Reel</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root{
    --paper:#F6F4F0; --ink:#111111; --orange:#FF5B14; --orange2:#FF7A3D; --stone:#8E8478;
  }
  html,body{margin:0;background:#1a1a1a;}
  body.render{background:var(--paper);}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--paper);
    font-family:'Archivo',sans-serif;color:var(--ink);transform-origin:0 0;}
  body:not(.render) #stage{margin:0 auto;}
  .panel{position:absolute;overflow:hidden;will-change:transform;}
  .panel .inner{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 45%;}
  .panel img.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
  .panel .ph{position:absolute;inset:0;}
  .panel .ph svg{width:100%;height:100%;display:block;}
  .panel .tag{position:absolute;left:22px;top:22px;font:600 20px/1 'Archivo';letter-spacing:.08em;
    color:rgba(17,17,17,.55);background:rgba(255,255,255,.55);padding:8px 12px;border-radius:6px;white-space:nowrap;}
  .mask{position:absolute;overflow:hidden;}
  .mask > span{display:block;will-change:transform;}
  .anton{font-family:'Anton',sans-serif;font-weight:400;line-height:.92;text-transform:uppercase;}
  .bodoni{font-family:'Bodoni Moda',serif;}
  .kicker{position:absolute;font:600 28px/1 'Archivo';letter-spacing:.32em;text-transform:uppercase;}
  .abs{position:absolute;}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90;}
  #scrim{position:absolute;left:0;right:0;bottom:0;height:1100px;opacity:0;z-index:20;
    background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,0) 100%);}
  #topscrim{position:absolute;left:0;right:0;top:0;height:360px;opacity:0;z-index:20;
    background:linear-gradient(to bottom,rgba(0,0,0,.45),rgba(0,0,0,0));}
  #sub{position:absolute;left:50%;top:1490px;transform:translateX(-50%);z-index:60;white-space:nowrap;
    font:600 40px/1.25 'Archivo';color:#fff;padding:14px 26px;border-radius:14px;background:rgba(17,17,17,.42);opacity:0;}
  #band{position:absolute;left:0;width:1080px;z-index:40;transform-origin:0 50%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #band .t{color:#fff;white-space:nowrap;text-align:center;}
  #end{position:absolute;inset:0;z-index:50;transform-origin:50% 45%;}
  #cta{position:absolute;left:540px;top:1300px;width:600px;height:136px;margin-left:-300px;margin-top:-68px;
    border-radius:68px;background:linear-gradient(180deg,var(--orange2),var(--orange));
    box-shadow:0 18px 40px rgba(255,91,20,.35);display:flex;align-items:center;justify-content:center;gap:22px;overflow:hidden;}
  #cta .lbl{position:relative;font:800 46px/1 'Archivo';letter-spacing:.06em;color:#fff;height:46px;width:400px;}
  #cta .lbl span{position:absolute;left:0;top:0;width:100%;text-align:left;white-space:nowrap;}
  #cta .shine{position:absolute;top:-20px;bottom:-20px;width:120px;left:-200px;
    background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:skewX(-18deg);}
  #ring{position:absolute;left:540px;top:1300px;width:600px;height:136px;margin-left:-300px;margin-top:-68px;
    border-radius:68px;border:4px solid var(--orange);opacity:0;}
  #hud{position:fixed;left:10px;top:10px;color:#fff;font:600 14px monospace;z-index:999;}
  body.render #hud{display:none;}
</style>
</head>
<body>
<div id="hud"></div>
<div id="stage">
  <div id="topscrim"></div>
  <div id="scrim"></div>

  <!-- Shot 1 typography -->
  <div id="s1word" class="abs anton" style="left:0;width:1080px;top:760px;text-align:center;font-size:250px;color:#fff;z-index:30;text-shadow:0 10px 50px rgba(0,0,0,.35);opacity:0"></div>
  <div id="s1kick" class="kicker" style="left:0;width:1080px;text-align:center;top:300px;color:var(--stone);z-index:30;opacity:0">SJCLOTHES &nbsp;·&nbsp; NEW SEASON</div>
  <div class="mask" id="s1m1" style="left:0;width:1080px;top:380px;height:170px;z-index:30"><span class="anton" style="font-size:168px;text-align:center">Looking for</span></div>
  <div class="mask" id="s1m2" style="left:0;width:1080px;top:548px;height:230px;z-index:30"><span class="bodoni" style="font-size:176px;font-style:italic;font-weight:600;color:var(--orange);text-align:center;line-height:1.15">your style?</span></div>

  <div class="mask" id="s2m2" style="left:72px;top:1240px;width:1000px;height:210px;z-index:30"><span class="anton" style="font-size:205px;color:#fff">SJClothes</span></div>
  <div id="s2bar" class="abs" style="left:80px;top:1462px;height:10px;width:0;background:var(--orange);z-index:30"></div>
  <div id="badge2" class="abs" style="left:640px;top:330px;width:330px;height:330px;z-index:35;opacity:0"></div>

  <!-- Shots 3/4 titles -->
  <div id="look" class="kicker" style="right:60px;top:110px;color:#fff;z-index:30;opacity:0;letter-spacing:.24em"></div>
  <div id="s3kick" class="kicker" style="left:80px;top:1000px;color:#fff;z-index:30;opacity:0">Men's collection</div>
  <div class="mask" id="s3m1" style="left:72px;top:1040px;width:900px;height:160px;z-index:30"><span class="bodoni" style="font-size:130px;font-style:italic;color:#fff;line-height:1.15">For</span></div>
  <div class="mask" id="s3m2" style="left:72px;top:1190px;width:900px;height:220px;z-index:30"><span class="anton" style="font-size:215px;color:#fff">Him</span></div>
  <div id="s3bar" class="abs" style="left:80px;top:1418px;height:10px;width:0;background:var(--orange);z-index:30"></div>

  <div id="s4kick" class="kicker" style="right:80px;top:1000px;color:#fff;z-index:30;opacity:0;text-align:right">Women's collection</div>
  <div class="mask" id="s4m1" style="right:72px;top:1040px;width:900px;height:160px;z-index:30"><span class="bodoni" style="font-size:130px;font-style:italic;color:#fff;line-height:1.15;text-align:right">For</span></div>
  <div class="mask" id="s4m2" style="right:72px;top:1190px;width:900px;height:220px;z-index:30"><span class="anton" style="font-size:215px;color:#fff;text-align:right">Her</span></div>
  <div id="s4bar" class="abs" style="right:80px;top:1418px;height:10px;width:0;background:var(--orange);z-index:30"></div>

  <!-- Shot 5 band -->
  <div id="band"><div class="t"></div></div>

  <!-- Shot 6 end card -->
  <div id="end" style="opacity:0">
    <svg id="rings" class="abs" style="left:240px;top:340px" width="600" height="600" viewBox="0 0 600 600">
      <circle id="r1" cx="300" cy="300" r="262" fill="none" stroke="#FF5B14" stroke-width="4" stroke-linecap="round"/>
      <circle id="r2" cx="300" cy="300" r="292" fill="none" stroke="#111" stroke-opacity=".18" stroke-width="2"/>
      <circle id="r3" cx="300" cy="300" r="232" fill="none" stroke="#FF5B14" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 14"/>
    </svg>
    <div id="badge6" class="abs" style="left:350px;top:450px;width:380px;height:380px"></div>
    <div id="word6" class="abs" style="left:0;width:1080px;top:880px;text-align:center;font:800 96px/1 'Archivo';color:var(--ink)">SJCLOTHES</div>
    <div id="tag6" class="abs" style="left:0;width:1080px;top:1010px;text-align:center;font:600 42px/1 'Archivo';letter-spacing:.14em">YOUR STYLE. <span style="color:var(--orange)">YOUR CHOICE.</span></div>
    <div id="dont" class="abs bodoni" style="left:0;width:1080px;top:1150px;text-align:center;font-size:64px;font-style:italic;line-height:1.25;color:var(--ink)">
      <div id="dont1">Don't just follow fashion.</div><div id="dont2" style="color:var(--orange)">Make it yours.</div></div>
    <div id="explore" class="abs bodoni" style="left:0;width:1080px;top:1135px;text-align:center;font-size:58px;font-style:italic;color:var(--ink);opacity:0">Explore our collection.</div>
    <div id="ring"></div>
    <div id="cta" style="opacity:0">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      <div class="lbl"><span id="cta1">DM US TO ORDER</span><span id="cta2" style="opacity:0">DM US TODAY</span></div>
      <div class="shine"></div>
    </div>
  </div>

  <div id="sub"></div>
  <div id="flash"></div>
</div>

<script>
/* ======================== CONFIG ======================== */
const DUR = 28.0, FPS = 30;
// Shot boundaries (seconds) — matched to the voiceover timing
const T = {s1:0, s2:4.0, s3:7.5, s4:11.75, s5:16.25, s6:22.0};

// Footage slots. Drop files into footage/ named <slot>.mp4|.mov|.jpg|.png — render.js picks them up.
const SLOTS = {
  presenter:    {label:'Female presenter · medium shot, to camera',  art:'presenter'},
  men_look1:    {label:'Male model · look 1 · full-body walk',       art:'man1'},
  men_detail:   {label:'Men · outfit close-up',                      art:'detailM'},
  men_look2:    {label:'Male model · look 2',                        art:'man2'},
  women_look1:  {label:'Female model · look 1 · editorial pose',     art:'woman1'},
  women_detail: {label:'Women · garment close-up',                   art:'detailW'},
  women_look2:  {label:'Female model · look 2',                      art:'woman2'},
  hook_detail:  {label:'Hook · clothing close-up',                   art:'detailW', fallback:'women_detail'},
  gallery_1:{fallback:'men_look2'}, gallery_2:{fallback:'women_look2'}, gallery_3:{fallback:'women_detail'},
  gallery_4:{fallback:'men_detail'}, gallery_5:{fallback:'men_look1'}, gallery_6:{fallback:'women_look1'},
};
// Filled in by render.js:  { slot: {type:'image', src} | {type:'video', dir, frames, fps} }
window.FOOTAGE = window.FOOTAGE || {};
const SHOW_TAGS = !new URLSearchParams(location.search).has('notags');

/* ======================== EASING ======================== */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=p=>1-Math.pow(1-p,3);
const eIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eExpo=p=>p>=1?1:1-Math.pow(2,-10*p);
const eBack=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const $=id=>document.getElementById(id);

/* ======================== PLACEHOLDER ART ======================== */
const SKIN='#B88B6E', HAIR='#231915';
function studio(c1,c2){return `<defs><radialGradient id="g" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#g)"/><rect y="1560" width="1080" height="360" fill="${c2}" opacity=".55"/>`;}
const ART = {
 man1:()=>studio('#EFEBE5','#D3CABD')+`<g class="fig"><ellipse cx="540" cy="1668" rx="230" ry="26" fill="#000" opacity=".12"/>
  <path d="M450 1180h85l-8 460h-58z" fill="#7E756B"/><path d="M545 1180h85l-18 460h-58z" fill="#857C71"/>
  <ellipse cx="497" cy="1652" rx="44" ry="16" fill="#111"/><ellipse cx="585" cy="1652" rx="44" ry="16" fill="#111"/>
  <path d="M398 470q142-44 284 0l46 720q-188 32-376 0z" fill="#1C1C1E"/>
  <path d="M398 478l-40 560 54 6 30-500z" fill="#232326"/><path d="M682 478l40 560-54 6-30-500z" fill="#232326"/>
  <path d="M540 470l-46 0 46 260 46-260z" fill="#EDE7DE"/><path d="M540 520v640" stroke="#000" stroke-opacity=".25" stroke-width="3"/>
  <rect x="514" y="395" width="52" height="70" rx="12" fill="${SKIN}"/>
  <ellipse cx="540" cy="330" rx="64" ry="78" fill="${SKIN}"/><path d="M476 318q0-96 64-96t66 92q-12-40-66-44t-64 48z" fill="${HAIR}"/></g>`,
 man2:()=>studio('#E6E2DA','#C9C0B2')+`<g class="fig"><ellipse cx="540" cy="1668" rx="230" ry="26" fill="#000" opacity=".12"/>
  <path d="M448 930h90l-10 710h-60z" fill="#23262B"/><path d="M542 930h90l-20 710h-60z" fill="#2A2E34"/>
  <ellipse cx="497" cy="1652" rx="46" ry="16" fill="#F2EFEA"/><ellipse cx="585" cy="1652" rx="46" ry="16" fill="#F2EFEA"/>
  <path d="M404 470q136-40 272 0l30 470q-166 30-332 0z" fill="#C49A6C"/>
  <path d="M488 470h104l-10 470h-84z" fill="#F4F1EC"/>
  <path d="M404 478l-46 520 54 8 34-470z" fill="#B88D60"/><path d="M676 478l46 520-54 8-34-470z" fill="#B88D60"/>
  <rect x="514" y="395" width="52" height="70" rx="12" fill="${SKIN}"/>
  <ellipse cx="540" cy="330" rx="64" ry="78" fill="${SKIN}"/><path d="M474 330q-6-108 66-108t66 104q-6-56-66-60t-66 64z" fill="${HAIR}"/></g>`,
 woman1:()=>studio('#F3ECE5','#DCCFC2')+`<g class="fig"><ellipse cx="540" cy="1668" rx="210" ry="24" fill="#000" opacity=".12"/>
  <path d="M492 1330h34l-6 320h-24z" fill="${SKIN}"/><path d="M556 1330h34l-4 320h-24z" fill="${SKIN}"/>
  <path d="M488 1640h40l-4 22h-44z" fill="#111"/><path d="M558 1640h40l6 22h-44z" fill="#111"/>
  <path d="M452 480q34 260 2 560l-34 6q-6-300 32-566z" fill="${SKIN}"/><path d="M628 480q-34 260-2 560l34 6q6-300-32-566z" fill="${SKIN}"/>
  <path d="M458 470h164l-26 300h-112z" fill="#FF5B14"/><path d="M484 770h112l176 600q-232 46-464 0z" fill="#FF6A2B"/>
  <path d="M484 770h112" stroke="#111" stroke-width="10"/>
  <rect x="520" y="400" width="40" height="72" rx="10" fill="${SKIN}"/>
  <path d="M470 330q-10-130 70-130t70 130q8 140 40 200h-220q32-60 40-200z" fill="${HAIR}"/>
  <ellipse cx="540" cy="330" rx="56" ry="72" fill="${SKIN}"/><path d="M484 320q4-92 56-92t60 80q-30-40-62-40t-54 52z" fill="${HAIR}"/></g>`,
 woman2:()=>studio('#ECE7E0','#CFC5B8')+`<g class="fig"><ellipse cx="540" cy="1668" rx="220" ry="24" fill="#000" opacity=".12"/>
  <path d="M488 1400h40l-4 250h-32z" fill="#151515"/><path d="M552 1400h40l0 250h-32z" fill="#151515"/>
  <path d="M482 1640h48l-2 24h-52z" fill="#111"/><path d="M552 1640h48l6 24h-52z" fill="#111"/>
  <path d="M436 470q104-36 208 0l66 990q-170 30-340 0z" fill="#D8C7AE"/>
  <path d="M500 470h80l-6 990h-68z" fill="#151515"/><path d="M500 470l40 240 40-240" fill="none" stroke="#BFAE94" stroke-width="10"/>
  <path d="M436 478l-50 580 50 6 40-520z" fill="#CDBBA0"/><path d="M644 478l50 580-50 6-40-520z" fill="#CDBBA0"/>
  <rect x="520" y="400" width="40" height="72" rx="10" fill="${SKIN}"/>
  <ellipse cx="540" cy="330" rx="56" ry="72" fill="${SKIN}"/><path d="M482 340q-8-120 58-120t60 108q-2 40 10 70q-20-110-70-120t-58 62z" fill="${HAIR}"/>
  <path d="M470 300q0-110 70-110t70 110z" fill="${HAIR}"/></g>`,
 presenter:()=>studio('#E4DED6','#BDB3A6')+`<circle cx="820" cy="420" r="260" fill="#fff" opacity=".25"/><g class="fig">
  <path d="M190 1920q10-560 160-700q190-90 380 0q150 140 160 700z" fill="#141414"/>
  <path d="M470 1120h140l-70 120z" fill="${SKIN}"/>
  <rect x="482" y="930" width="116" height="210" rx="40" fill="${SKIN}"/>
  <path d="M370 700q-20-320 170-320t170 320q20 330 90 460q-120 60-260 20q-140 40-260-20q70-130 90-460z" fill="${HAIR}"/>
  <ellipse cx="540" cy="700" rx="140" ry="178" fill="${SKIN}"/>
  <path d="M400 690q0-230 140-230t146 200q-60-110-146-110t-140 140z" fill="${HAIR}"/></g>`,
 detailM:()=>`<defs><pattern id="tw" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="#2E3D55"/><rect width="7" height="16" fill="#364869"/></pattern></defs>
  <rect width="1080" height="1920" fill="url(#tw)"/><g class="fig"><path d="M300 0v1920" stroke="#1F2A3C" stroke-width="40"/>
  <path d="M300 0v1920" stroke="#FF8A3D" stroke-width="5" stroke-dasharray="22 16" transform="translate(-34 0)"/>
  <path d="M300 0v1920" stroke="#FF8A3D" stroke-width="5" stroke-dasharray="22 16" transform="translate(34 0)"/>
  <g fill="#B9B3A8" stroke="#8D867B" stroke-width="8"><circle cx="300" cy="620" r="62"/><circle cx="300" cy="1180" r="62"/></g>
  <g fill="#8D867B"><circle cx="280" cy="610" r="9"/><circle cx="320" cy="630" r="9"/><circle cx="280" cy="1170" r="9"/><circle cx="320" cy="1190" r="9"/></g>
  <path d="M640 0q120 900 0 1920" stroke="#1F2A3C" stroke-width="26" fill="none" opacity=".6"/></g>`,
 detailW:()=>`<defs><pattern id="rib" width="36" height="36" patternUnits="userSpaceOnUse"><rect width="36" height="36" fill="#F2652A"/><rect width="18" height="36" fill="#FF7A3D"/></pattern>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient></defs>
  <rect width="1080" height="1920" fill="url(#rib)"/><rect width="1080" height="1920" fill="url(#sh)"/>
  <g class="fig"><path d="M0 1260q540-120 1080 0v660H0z" fill="#111"/><path d="M0 1260q540-120 1080 0" stroke="#E9D9B8" stroke-width="10" fill="none"/>
  <circle cx="540" cy="900" r="70" fill="#E9D9B8"/><circle cx="540" cy="900" r="44" fill="none" stroke="#C8B48C" stroke-width="8"/></g>`,
};

/* ======================== PANELS ======================== */
const stage=$('stage');
function resolveSlot(slot){
  let s=slot, guard=0;
  while(!FOOTAGE[s] && SLOTS[s] && SLOTS[s].fallback && guard++<5) s=SLOTS[s].fallback;
  return s;
}
function makePanel(z){
  const el=document.createElement('div'); el.className='panel'; el.style.zIndex=z;
  el.innerHTML='<div class="inner"><img class="media"><div class="ph"></div></div><div class="tag"></div>';
  stage.appendChild(el);
  return {el, inner:el.firstChild, img:el.querySelector('img'), ph:el.querySelector('.ph'), tag:el.querySelector('.tag'), slot:null};
}
const pending=[]; let UID=0;
function setPanel(p, o){
  if(!o || o.opacity===0 || o.w<=0 || o.h<=0){ p.el.style.display='none'; return; }
  const s=resolveSlot(o.slot), f=FOOTAGE[s], art=(SLOTS[s]||SLOTS[o.slot]).art||SLOTS[resolveSlot(o.slot)]?.art;
  p.el.style.display='block';
  const x=o.x??0, y=o.y??0, w=o.w??1080, h=o.h??1920;
  Object.assign(p.el.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',opacity:o.opacity??1,
    borderRadius:(o.r||0)+'px', filter:o.blur?`blur(${o.blur}px)`:'none'});
  // stage-anchored content (for wipes): inner fills the whole stage, offset by panel position
  if(o.anchor==='stage'){ Object.assign(p.inner.style,{left:(-x)+'px',top:(-y)+'px',width:'1080px',height:'1920px'}); }
  else { Object.assign(p.inner.style,{left:'0px',top:'0px',width:'100%',height:'100%'}); }
  p.inner.style.transform=`translate(${o.tx||0}px,${o.ty||0}px) scale(${o.scale||1})`;
  if(f){
    p.ph.style.display='none'; p.img.style.display='block'; p.tag.style.display='none';
    let src=f.src;
    if(f.type==='video'){ const n=Math.max(1,f.frames); let i=Math.floor(Math.max(0,o.tl||0)*f.fps)%n; src=`${f.dir}/f_${String(i+1).padStart(5,'0')}.jpg`; }
    if(p.img.getAttribute('src')!==src){ p.img.setAttribute('src',src); pending.push(p.img.decode().catch(()=>{})); }
  } else {
    p.img.style.display='none'; p.ph.style.display='block';
    if(p.slot!==s){ const u='u'+(++UID); const svg=ART[art]().replace(/id="(\w+)"/g,`id="$1_${u}"`).replace(/url\(#(\w+)\)/g,`url(#$1_${u})`);
      p.ph.innerHTML=`<svg viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">${svg}</svg>`; p.slot=s; }
    const fig=p.ph.querySelector('.fig'), tl=o.tl||0;
    if(fig){ const bob=o.walk?Math.abs(Math.sin(tl*Math.PI*2.2))*-14:0, sway=o.sway?Math.sin(tl*2.4)*6:0;
      fig.setAttribute('transform',`translate(${sway} ${bob})`); }
    p.tag.style.display=SHOW_TAGS&&(o.w>=900)?'block':'none';

function mask(id,t,a,dur=.5,out=null,outDur=.3){ // slide-up text reveal inside a mask

  if(out!==null && t>=out) y=lerp(0,-110,eIO(P(t,out,out+outDur)));

}
function fade(id,t,a,b,inD=.25,outD=.25){ const o=t<a||t>b?0:Math.min(P(t,a,a+inD), 1-P(t,b-outD,b)); $(id).style.opacity=o; return o; }

  { const L=$('look'); let txt='', o=0;

      // exit into end card (shot 6)

    B.style.display=show?'flex':'none'; }

  { const E=$('end');

      $('r3').setAttribute('transform',`rotate(${t*-20} 300 300)`); $('r3').style.opacity=P(t,22.8,23.3);
