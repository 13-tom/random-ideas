# Local dev only: Postgres + MinIO (S3-compatible, stands in for R2).
# The backend's defaults in app/config.py already point at these -
# `docker compose -f web/docker-compose.dev.yml up -d`, create the MinIO
# bucket once (`katgaireel-dev`, matching R2_BUCKET_NAME), then run the
# backend locally against it.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: katgaireel
      POSTGRES_PASSWORD: katgaireel
      POSTGRES_DB: katgaireel
    ports:
      - "5432:5432"
    volumes:
      - katgaireel_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"  # web console
    volumes:
      - katgaireel_minio_data:/data

volumes:
  katgaireel_postgres_data:
  katgaireel_minio_data:
